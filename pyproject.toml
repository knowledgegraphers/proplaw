[tool.ruff]
# Exclude raw data directories and one-off shell scripts that aren't Python modules.
# propra/graph/<state>_section_edges.py are generated by generate_state_section_edges.py
# and never edited by hand, so they are not linted either. The [!g] keeps the
# generator itself (generate_*) in scope — it is real code.
exclude = [
    "data/",
    "propra/graph/[!g]*_section_edges.py",
]
